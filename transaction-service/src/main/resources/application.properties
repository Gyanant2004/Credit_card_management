spring.application.name=transaction-service
server.port=8084

# Use the SAME Oracle database and schema as purchase-service.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/freepdb1
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Read/write existing tables without creating or altering them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Avoid automatic retries of payment operations.
spring.cloud.loadbalancer.retry.enabled=false

# Application settings
app.business-zone=Asia/Kolkata
app.card-service-url=http://CREDIT-CARD-SERVICE

