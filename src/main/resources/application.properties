spring.application.name=credit-card-service
server.port=8082

# Set these environment variables to match your Oracle SQL Developer connection.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Use the CREDIT_CARD table created in Oracle; do not silently modify its schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
